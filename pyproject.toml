[project]
name = "canonkit"
version = "0.1.0"
description = "Validate and route one-home knowledge packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
canonkit = "canonkit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canonkit*"]
